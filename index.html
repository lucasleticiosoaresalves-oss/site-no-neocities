<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title> QUARTO DO LUCAS </title>
</head>
<style> 
    :root { 
        --azul-escuro: #1a3a5c;
        --azul-medio: #3a6ea5;
        --azul-claro: #a9c6e8;
        --lilas: #c9a6e0;
        --rosa: #e85d9c;
        --fundo-janela: #e8eef5;
    }

    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #5a7a9a;
        font-family: Tahoma, Verdana, sans-serif;
        display: flex;
        justify-content:center;
        padding: 20px;
    }
    .janela {
        width: 1200px;
        background: var(--fundo-janela); 
        border: 4px solid #0058ee;
        border-radius: 8px 8px 3px 3px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, .5);
        overflow: hidden;
    }
    .barra-titulo {
        background: linear-gradient(180deg, #0058ee 0%, #3f8cf3 8%, #0058ee 40%, #0058ee 100%);
        color: #fff;
        padding: 5px 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
    }
    .botoes { 
        display: flex; 
        gap: 3px; 
    }
    .botoes span {
        display: inline-block;
        width: 22px; height: 20px;
        background: linear-gradient(180deg, #5b9bf5, #1a4fa0);
        box-shadow: inset 1px 1px 0 rgba(255,255,255,.5), inset -1px -1px 0 rgba(0,0,0,.3);
        border: 1px solid rgba(255,255,255,.4);
        text-align: center;
        line-height: 18px;
        border-radius: 3px;
        font-size: 11px;
    }
    .botoes .fechar {
        background: linear-gradient(180deg, #f57a7a, #c02020);
        box-shadow: inset 1px 1px 0 rgba(255,255,255,.5), inset -1px -1px 0 rgba(0,0,0,.3);
    }
    .abas {
        background: #7fa8d9;
        display: flex;
        align-items: flex-end;
        gap: 2px;
        padding: 4px 10px 0;
    }
    .aba {
        background: #c3d6ea;
        padding: 6px 14px;
        border-radius: 6px 6px 0 0;
        font-size: 11px;
        color: #1a3a5c;
    }
    .aba.ativa { background: #fff; font-weight: bold; }
    .aba.nova { padding: 6px 10px; }
    .icone-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 26px;
        height: 24px;
        padding: 0 4px;
        font-size: 14px;
        border: 1px solid transparent;
        border-radius: 3px;
    }
    .icone-btn:hover {
        border: 1px solid #7f9db9;
        background: #dceafb;
    }
    .icone-btn.ir {
        background: #3a6ea5;
        color: #fff;
        border-radius: 3px;
    }
    .barra-endereco { 
        background: #ece9d8; 
        padding: 5px 10px; 
        display: flex; 
        align-items: center; 
        gap: 6px; 
        border-bottom: 1px solid #b5b5b5; 
        font-size: 11px; 
    } 
    .barra-endereco input {
         flex: 1; 
         padding: 3px 6px; 
         border: 1px solid #7f9db9; 
    }
    .barra-endereco .busca {
        flex: none;
        width: 160px;
    }
    .barra-menu { 
        background: #ece9d8; 
        font-size: 11px; 
        padding: 3px 10px; 
        display: flex; 
        align-items: center; 
        gap: 16px; 
        border-bottom: 1px solid #b5b5b5; 
    } 
    .barra-menu .direita { 
        margin-left: auto; 
    }
    .barra-ferramentas { 
        background: #ece9d8; 
        padding: 5px 10px; 
        display: flex; 
        align-items: center; 
        gap: 10px; 
        border-bottom: 1px solid #b5b5b5; 
        font-size: 11px; 
    }
    .topo {
        background: linear-gradient(180deg,#274b7a,#1a3a5c);
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .nav a {
        color: #fff;
        text-decoration:none;
        background: #3a6ea5;
        padding: 8px 16px;
        border-radius: 14px;
        font-size: 13px;
        
    }
    .nav a.ativo {
        background: var(--rosa); 
    }
    .nav { 
        display: flex; 
        align-items: center; 
        gap: 8px; 
    }
    .conteudo {
        background:linear-gradient(180deg, #274b7a 0%, #14263f 100%);
        padding: 18px;
        display: grid;
        grid-template-columns: 190px 1fr 300px;
        gap: 16px;
    }
    .nav input[type=text] {
         padding: 8px 10px; 
         border-radius: 14px; 
         border: none; 
         width: 160px; 
    }
    .logo {
         height: 60px; 
         width: auto; 
    }
    .perfil-lateral {

        display:flex;
        flex-direction:column;
        gap: 10px;
    }
    .fotodeperfil {
        background: #0d1b2b;
        border: 2px solid var(--lilas);
        border-radius: 6px;
        padding: 6px;
        text-align: center;
    }
    .fotodeperfil img {
        width: 100%;
        border-radius: 3px;
        display: block;
    }
    .menuperfil a {
        display:block;
        padding: 8px 12px;
        color: #1a3a5c;
        text-decoration:none;
        border-bottom: 1px solid #c3d6ea;
    }
    .cadeado {
        width: 60px; height: 60px; 
        border-radius: 50%;
        display:flex; 
        align-items:center; 
        justify-content:center;
    }
</style>
<body>
   
<div class="janela">

    <div class="barra-titulo">
         <span>🌐 QUARTO DO LUCAS</span> 
         <div class="botoes">
            <span>_</span><span>□</span><span class="fechar">✕</span>
         </div> 
    </div>

    <div class="abas">
        <span class="aba ativa">🌐 QUARTO DO LUCAS</span>
        <span class="aba nova">+</span>
    </div>

    <div class="barra-endereco"> 
        <span class="icone-btn">◀</span>
        <span class="icone-btn">▶</span>
        <input type="text" value="https://quartodolucas.neocities.org/profile/[Lucas]" readonly> 
        <span class="icone-btn">🔄</span>
        <span class="icone-btn ir">➜</span>
        <input class="busca" type="text" placeholder="Pesquisar"> 
        <span class="icone-btn">🔍</span>
    </div>

    <div class="barra-menu"> 
        <span>Arquivo</span>
        <span>Editar</span>
        <span>Exibir</span> 
        <span>Favoritos</span>
        <span>Ferramentas</span>
        <span>Ajuda</span>
        <div class="direita">Links »</div>
    </div>

    <div class="barra-ferramentas"> 
        <span class="icone-btn">🏠</span>
        <span class="icone-btn">⭐</span>
        <span class="icone-btn">🖨️</span>
        <span class="icone-btn">✉️</span>
        <span class="icone-btn">💬</span>
    </div>


    <div class="topo">
        <div class="logo"> 
       <img class="logo" src="logosite.png" alt="Quarto do Lucas">
       </div> 
        <div class="nav" >
            <a class="ativo"> INÍCIO </a>
            <a> Perfil </a>
            <a> Àlbuns</a>
            <a> Redes Sociais </a>
            <a> Diário </a>
            <input type="text" placeholder="Pesquisar">
        </div>
     </div>

    <div class="conteudo"> 
        <div class="perfil-lateral"> 
            <div class="fotodeperfil"> 
                <img src="" alt="foto de perfil">
            </div>
            <div class="menuperfil">
                <a> Sobre mim. </a>
                <a> Photodump. </a>
                <a> Projetos.  </a>
                <a> Playlist.  </a>
            </div>
        </div>
        <div class="coluna-central">...</div>
        <div class="coluna-direita">...</div>
    </div>

</div>
</body>
</html>
